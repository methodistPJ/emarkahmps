name: Verify assessment release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build.py
      - run: git diff --exit-code -- src/Workspace.html
      - run: npm test
